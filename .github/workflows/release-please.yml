name: Release Please

on:
  push:
    branches: [main]

# issues: write is listed by the action docs; it lets release-please create/apply its autorelease labels.
permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # PAT/App token lets CI run on the release PR; falls back to GITHUB_TOKEN until the secret exists.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
