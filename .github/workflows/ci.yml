name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Mammapuls.slnx

      - name: Build
        run: dotnet build Mammapuls.slnx --no-restore --configuration Release

      # Exits 0 when the solution has no test projects yet.
      - name: Test
        run: dotnet test Mammapuls.slnx --no-build --configuration Release
